
name: Build PW Auto Fishing v1.3 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Auto Fishing v1.3
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile

          z = Path('PW_AutoFishing_v1.3_Android_Source.zip')

          if not z.is_file():
              raise SystemExit('File ZIP v1.3 tidak ditemukan')

          with ZipFile(z) as archive:
              for name in archive.namelist():
                  if name.startswith('/') or '..' in Path(name).parts:
                      raise SystemExit('Unsafe ZIP path')
              archive.extractall('.')

          print('Project v1.3 extracted')
          PYCODE

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PW-AutoFishing-v1.3-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
